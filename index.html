<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COT Market Bias Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
  if (typeof Chart === 'undefined') {
    document.write('<scr' + 'ipt src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></scr' + 'ipt>');
  }
</script>
<style>
  :root{
    --bg:#0A0D10; --panel:#12161B; --panel-2:#161B21; --panel-3:#191F26; --line:#232A31;
    --text:#E7EAED; --muted:#8A94A0; --dim:#4B545C;
    --long:#4ADE80; --short:#F87171; --neutral:#E8B04B;
    --bar:#1E3A5F; --bar-text:#DCE6F2;
    --smart:#5EC8D8; --dumb:#E8B04B;
    --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{padding:24px 20px 60px;}
  .wrap{max-width:1100px;margin:0 auto;}

  header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:16px;}
  h1{font-family:var(--mono);font-size:19px;letter-spacing:0.05em;text-transform:uppercase;font-weight:600;margin:0;}
  .asof{font-family:var(--mono);font-size:12px;color:var(--muted);}
  .asof b{color:var(--text);}

  .picker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .pick-btn{font-family:var(--mono);font-size:12px;padding:6px 12px;border-radius:5px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;transition:all .12s ease;}
  .pick-btn:hover{border-color:#3a4552;color:var(--text);}
  .pick-btn.active{background:var(--bar);border-color:var(--bar);color:var(--bar-text);}

  .titlebar{background:var(--bar);color:var(--bar-text);font-family:var(--mono);font-weight:600;font-size:14px;letter-spacing:0.03em;text-align:center;padding:10px;border-radius:6px 6px 0 0;}

  .bias-box{background:var(--panel);border:1px solid var(--line);border-top:none;padding:16px 18px;font-size:13px;line-height:1.65;}
  .bias-row{display:flex;justify-content:space-between;gap:10px;}
  .bias-row .k{color:var(--muted);}
  .bias-row .v{font-family:var(--mono);}
  .bias-label{font-weight:700;font-size:14px;}
  .bias-label.pos{color:var(--long);}
  .bias-label.neg{color:var(--short);}
  .bias-label.flat{color:var(--neutral);}
  .weeks{margin:8px 0;font-family:var(--mono);font-size:12px;color:var(--muted);}
  .weeks div span:last-child{color:var(--text);}
  .note{color:var(--muted);margin-top:6px;}
  .note b{color:var(--text);font-weight:600;}

  .section-label{font-family:var(--mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;}

  /* --- composite score gauge --- */
  .composite-block{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:flex;align-items:center;gap:20px;}
  .composite-num{font-family:var(--mono);font-size:32px;font-weight:700;min-width:90px;}
  .composite-num.pos{color:var(--long);} .composite-num.neg{color:var(--short);} .composite-num.flat{color:var(--neutral);}
  .gauge-wrap{flex:1;}
  .gauge{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--short),#3A4048 48%,#3A4048 52%,var(--long));}
  .gauge .marker{position:absolute;top:-4px;width:3px;height:16px;background:var(--text);border-radius:1px;}
  .gauge-labels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:5px;}

  /* --- 1/3/10yr windows, side by side --- */
  .windows{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .window-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;}
  .window-card.na{opacity:0.4;}
  .window-title{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:0.05em;margin-bottom:8px;}
  .window-pct{font-family:var(--mono);font-size:24px;font-weight:700;}
  .window-sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px;}
  .window-reading{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.4;}

  /* --- concordance --- */
  .concordance{display:inline-block;font-family:var(--mono);font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:6px;background:var(--panel);border:1px solid var(--line);}
  .concordance.extreme{color:var(--short);border-color:#4a2b2b;}
  .concordance.neutral{color:var(--muted);}
  .concordance.partial{color:var(--neutral);border-color:#4a3f2b;}

  /* --- divergence --- */
  .divergence-block{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;}
  .div-bars{display:flex;flex-direction:column;gap:10px;margin-bottom:10px;}
  .div-row{display:flex;align-items:center;gap:10px;}
  .div-row .lbl{font-family:var(--mono);font-size:11.5px;color:var(--muted);width:150px;flex-shrink:0;}
  .div-track{flex:1;height:8px;background:#1E252C;border-radius:4px;position:relative;}
  .div-fill{position:absolute;top:0;left:0;height:100%;border-radius:4px;}
  .div-fill.smart{background:var(--smart);}
  .div-fill.dumb{background:var(--dumb);}
  .div-val{font-family:var(--mono);font-size:11.5px;width:44px;text-align:right;}
  .div-gap{font-family:var(--mono);font-size:12.5px;color:var(--text);margin-top:4px;}
  .div-label{margin-top:8px;font-size:12.5px;font-weight:600;}
  .div-label.flag{color:var(--short);}
  .div-label.ok{color:var(--muted);}

  .chart-block{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px 8px;margin-bottom:10px;}
  .chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .chart-title{font-size:13px;font-weight:600;}
  .trend{font-family:var(--mono);font-size:11px;color:var(--muted);}
  .trend.up{color:var(--long);} .trend.down{color:var(--short);}
  canvas{max-height:220px;}

  footer{margin-top:32px;color:var(--dim);font-size:11px;font-family:var(--mono);text-align:center;}
  @media (max-width:640px){ .windows{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>COT Market Bias Dashboard</h1>
    <div class="asof">Data as of <b id="asof">—</b> · Updated <span id="generated">—</span></div>
  </header>

  <div class="picker" id="picker"></div>
  <div id="content"></div>

  <footer>Generated from COT_Data_V8new.xlsx via extract_market_bias.py / CotDashboardSync.gs — not investment advice.</footer>
</div>

<script>
const DATA_URL = 'market_bias.json';
let DATA = null;
let current = 'Gold';
let charts = [];

function fmtNum(v){ return (v===null||v===undefined) ? '—' : Number(v).toLocaleString(); }
function fmtSigned(v){ if(v===null||v===undefined) return '—'; return (v>0?'+':'')+Number(v).toLocaleString(); }
function fmtPct(v){ return (v===null||v===undefined) ? '—' : (v*100).toFixed(1)+'%'; }
function fmtIdx(v){ return (v===null||v===undefined) ? '—' : Number(v).toFixed(1); }

function biasClass(score){
  if(score===null||score===undefined) return 'flat';
  if(score>20) return 'pos';
  if(score<-20) return 'neg';
  return 'flat';
}

function trendFor(history){
  if(!history || history.length<2) return {dir:'flat', text:'Flat'};
  const newest = history[0].net, oldest = history[history.length-1].net;
  if(newest===null||oldest===null) return {dir:'flat', text:'Flat'};
  return newest>=oldest ? {dir:'up', text:'Bullish'} : {dir:'down', text:'Bearish'};
}

function concordanceClass(flag){
  if(!flag) return 'neutral';
  if(flag.indexOf('Confirmed Extreme') === 0) return 'extreme';
  if(flag.indexOf('Recent Move') === 0) return 'partial';
  return 'neutral';
}

function windowCard(title, pct, idx, reading){
  const na = (pct===null||pct===undefined);
  return `
    <div class="window-card ${na?'na':''}">
      <div class="window-title">${title}</div>
      <div class="window-pct">${na?'N/A':fmtPct(pct)}</div>
      <div class="window-sub">COT Index: ${na?'—':fmtIdx(idx)} / 100</div>
      <div class="window-reading">${na?'Not tracked for this asset.':(reading||'')}</div>
    </div>
  `;
}

function renderContent(){
  const el = document.getElementById('content');
  const asset = DATA.assets.find(a => a.name === current);
  const mb = asset.market_bias;
  const pos = asset.positioning;
  const div = asset.divergence;

  const gaugePos = Math.max(0, Math.min(100, ((asset.composite_score + 100) / 200) * 100));
  const cclass = concordanceClass(asset.concordance_flag);

  el.innerHTML = `
    <div class="titlebar">${asset.name} COT Data</div>
    <div class="bias-box">
      <div class="bias-row"><span class="k">Market Bias:</span><span class="v bias-label ${biasClass(asset.composite_score)}">${mb.bias_label}</span></div>
      <div class="bias-row"><span class="k">Positioning:</span><span class="v">${mb.positioning_label}</span></div>
      <div class="weeks">
        ${mb.weeks.map(w => `<div><span>${w.label}:</span> <span>${fmtNum(w.value)} (Change: ${fmtSigned(w.change)})</span></div>`).join('')}
      </div>
      <div class="note"><b>Historical:</b> ${mb.historical_note || '—'}</div>
      <div class="note"><b>Overall:</b> ${mb.overall_note || '—'}</div>
    </div>

    <div class="section-label">Composite Score</div>
    <div class="composite-block">
      <div class="composite-num ${biasClass(asset.composite_score)}">${asset.composite_score>0?'+':''}${Number(asset.composite_score).toFixed(1)}</div>
      <div class="gauge-wrap">
        <div class="gauge"><div class="marker" style="left:${gaugePos}%"></div></div>
        <div class="gauge-labels"><span>-100 Bearish</span><span>0 Neutral</span><span>+100 Bullish</span></div>
      </div>
    </div>

    <div class="section-label">Positioning Windows — Percentile &amp; COT Index (0–100 min-max), by window</div>
    <div class="windows">
      ${windowCard('1 Year', pos.pct_1yr, pos.cot_index_1yr, pos.reading_1yr)}
      ${windowCard('3 Year', pos.pct_3yr, pos.cot_index_3yr, pos.reading_3yr)}
      ${windowCard('10 Year', pos.pct_10yr, pos.cot_index_10yr, pos.reading_10yr)}
    </div>

    <div class="section-label">Concordance — agreement across the 1Yr &amp; 3Yr (&amp; 10Yr where tracked) windows above</div>
    <div class="concordance ${cclass}">${asset.concordance_flag || 'Unknown'}</div>

    <div class="section-label">Smart Money vs. Dumb Money Divergence (1Yr Percentile)</div>
    <div class="divergence-block">
      <div class="div-bars">
        <div class="div-row">
          <span class="lbl">Dumb (Speculators)</span>
          <div class="div-track"><div class="div-fill dumb" style="width:${(div.dumb_pct_1yr||0)*100}%"></div></div>
          <span class="div-val">${fmtPct(div.dumb_pct_1yr)}</span>
        </div>
        <div class="div-row">
          <span class="lbl">Smart (Commercials)</span>
          <div class="div-track"><div class="div-fill smart" style="width:${(div.smart_pct_1yr||0)*100}%"></div></div>
          <span class="div-val">${fmtPct(div.smart_pct_1yr)}</span>
        </div>
      </div>
      <div class="div-gap">Divergence Score (gap): ${div.score!==null && div.score!==undefined ? Number(div.score).toFixed(1) : '—'}</div>
      <div class="div-label ${Math.abs(div.score||0)>50?'flag':'ok'}">${div.label || '—'}</div>
    </div>

    <div class="section-label">Net Position History</div>
    <div id="charts"></div>
  `;

  charts.forEach(c => c.destroy());
  charts = [];
  const chartsEl = document.getElementById('charts');

  asset.categories.forEach(cat => {
    const block = document.createElement('div');
    block.className = 'chart-block';
    const t = trendFor(cat.history);
    block.innerHTML = `
      <div class="chart-head">
        <span class="chart-title">${cat.label} Net Positions</span>
        <span class="trend ${t.dir}">Trend: ${t.text}</span>
      </div>
      <canvas></canvas>
    `;
    chartsEl.appendChild(block);

    const hist = cat.history.slice().reverse();
    const ctx = block.querySelector('canvas').getContext('2d');
    const color = cat.role === 'speculative' ? '#5EC8D8' : (cat.role === 'commercial' || cat.role === 'institutional' ? '#E8B04B' : '#8B8FE8');
    const c = new Chart(ctx, {
      type: 'line',
      data: { labels: hist.map(h => h.date), datasets: [{ data: hist.map(h => h.net), borderColor: color, backgroundColor: 'transparent', pointRadius: 0, borderWidth: 1.75, tension: 0.15 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#7C8790', maxTicksLimit: 8, font: { family: 'IBM Plex Mono', size: 9 } }, grid: { color: '#1A2027' } },
          y: { ticks: { color: '#7C8790', callback: v => Number(v).toLocaleString(), font: { family: 'IBM Plex Mono', size: 9 } }, grid: { color: '#1A2027' } },
        }
      }
    });
    charts.push(c);
  });
}

function renderPicker(){
  const el = document.getElementById('picker');
  el.innerHTML = '';
  DATA.assets.forEach(a => {
    const b = document.createElement('button');
    b.className = 'pick-btn' + (a.name===current ? ' active' : '');
    b.textContent = a.name;
    b.onclick = () => { current = a.name; renderPicker(); renderContent(); };
    el.appendChild(b);
  });
}

fetch(DATA_URL)
  .then(r => r.json())
  .then(d => {
    DATA = d;
    document.getElementById('asof').textContent = d.as_of_date;
    document.getElementById('generated').textContent = d.generated_at;
    renderPicker();
    renderContent();
  })
  .catch(err => {
    document.getElementById('content').innerHTML =
      '<div style="color:var(--muted);font-family:var(--mono);">Could not load ' + DATA_URL + ' — ' + err + '</div>';
  });
</script>
</body>
</html>
