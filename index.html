<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COT Market Bias Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0A0D10; --panel:#12161B; --panel-2:#161B21; --line:#232A31;
    --text:#E7EAED; --muted:#8A94A0; --dim:#4B545C;
    --long:#4ADE80; --short:#F87171; --neutral:#E8B04B;
    --bar:#1E3A5F; --bar-text:#DCE6F2;
    --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{padding:24px 20px 60px;}
  .wrap{max-width:1400px;margin:0 auto;}

  header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:16px;}
  h1{font-family:var(--mono);font-size:19px;letter-spacing:0.05em;text-transform:uppercase;font-weight:600;margin:0;}
  .asof{font-family:var(--mono);font-size:12px;color:var(--muted);}
  .asof b{color:var(--text);}

  .panes{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:980px){ .panes{grid-template-columns:1fr;} }

  .pane-picker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .pick-btn{font-family:var(--mono);font-size:11px;padding:5px 10px;border-radius:5px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;transition:all .12s ease;}
  .pick-btn:hover{border-color:#3a4552;color:var(--text);}
  .pick-btn.active{background:var(--bar);border-color:var(--bar);color:var(--bar-text);}

  .titlebar{background:var(--bar);color:var(--bar-text);font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:0.03em;text-align:center;padding:9px;border-radius:6px 6px 0 0;}

  .bias-box{background:var(--panel);border:1px solid var(--line);border-top:none;padding:14px 16px;font-size:12.5px;line-height:1.65;}
  .bias-row{display:flex;justify-content:space-between;gap:10px;}
  .bias-row .k{color:var(--muted);}
  .bias-row .v{font-family:var(--mono);}
  .bias-label{font-weight:700;font-size:13px;}
  .bias-label.pos{color:var(--long);}
  .bias-label.neg{color:var(--short);}
  .bias-label.flat{color:var(--neutral);}
  .weeks{margin:8px 0;font-family:var(--mono);font-size:11.5px;color:var(--muted);}
  .weeks div span:last-child{color:var(--text);}
  .note{color:var(--muted);margin-top:6px;}
  .note b{color:var(--text);font-weight:600;}

  .chart-block{background:var(--panel);border:1px solid var(--line);border-top:none;padding:14px 16px 8px;}
  .chart-block:last-child{border-radius:0 0 8px 8px;}
  .chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .chart-title{font-size:13px;font-weight:600;}
  .trend{font-family:var(--mono);font-size:11px;color:var(--muted);}
  .trend.up{color:var(--long);}
  .trend.down{color:var(--short);}
  canvas{max-height:200px;}

  footer{margin-top:32px;color:var(--dim);font-size:11px;font-family:var(--mono);text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>COT Market Bias Dashboard</h1>
    <div class="asof">Data as of <b id="asof">—</b> · Updated <span id="generated">—</span></div>
  </header>

  <div class="panes">
    <div class="pane" data-pane="left"></div>
    <div class="pane" data-pane="right"></div>
  </div>

  <footer>Generated from COT_Data_V8new.xlsx via extract_market_bias.py — not investment advice.</footer>
</div>

<script>
const DATA_URL = 'market_bias.json';
let DATA = null;
const state = { left: 'Gold', right: 'DXY' };
const charts = { left: [], right: [] };

function fmtNum(v){ return (v===null||v===undefined) ? '—' : Number(v).toLocaleString(); }
function fmtSigned(v){ if(v===null||v===undefined) return '—'; return (v>0?'+':'')+Number(v).toLocaleString(); }

function biasClass(score){
  if(score===null||score===undefined) return 'flat';
  if(score>20) return 'pos';
  if(score<-20) return 'neg';
  return 'flat';
}

function trendFor(history){
  // history is newest-first; compare oldest vs newest in the displayed window
  if(!history || history.length<2) return {dir:'flat', text:'Flat'};
  const newest = history[0].net, oldest = history[history.length-1].net;
  if(newest===null||oldest===null) return {dir:'flat', text:'Flat'};
  return newest>=oldest ? {dir:'up', text:'Bullish'} : {dir:'down', text:'Bearish'};
}

function buildPane(side){
  const container = document.querySelector(`.pane[data-pane="${side}"]`);
  container.innerHTML = '';

  const picker = document.createElement('div');
  picker.className = 'pane-picker';
  DATA.assets.forEach(a => {
    const b = document.createElement('button');
    b.className = 'pick-btn' + (a.name===state[side] ? ' active' : '');
    b.textContent = a.name;
    b.onclick = () => { state[side] = a.name; renderPane(side); };
    picker.appendChild(b);
  });
  container.appendChild(picker);

  const asset = DATA.assets.find(a => a.name === state[side]);

  const titlebar = document.createElement('div');
  titlebar.className = 'titlebar';
  titlebar.textContent = `${asset.name} COT Data`;
  container.appendChild(titlebar);

  const mb = asset.market_bias;
  const box = document.createElement('div');
  box.className = 'bias-box';
  box.innerHTML = `
    <div class="bias-row"><span class="k">Market Bias:</span><span class="v bias-label ${biasClass(asset.composite_score)}">${mb.bias_label}</span></div>
    <div class="bias-row"><span class="k">Positioning:</span><span class="v">${mb.positioning_label}</span></div>
    <div class="weeks">
      ${mb.weeks.map(w => `<div><span>${w.label}:</span> <span>${fmtNum(w.value)} (Change: ${fmtSigned(w.change)})</span></div>`).join('')}
    </div>
    <div class="note"><b>Historical:</b> ${mb.historical_note || '—'}</div>
    <div class="note"><b>Overall:</b> ${mb.overall_note || '—'}</div>
  `;
  container.appendChild(box);

  charts[side].forEach(c => c.destroy());
  charts[side] = [];

  asset.categories.forEach((cat, i) => {
    const block = document.createElement('div');
    block.className = 'chart-block';
    const t = trendFor(cat.history);
    block.innerHTML = `
      <div class="chart-head">
        <span class="chart-title">${cat.label} Net Positions</span>
        <span class="trend ${t.dir}">Trend: ${t.text}</span>
      </div>
      <canvas></canvas>
    `;
    container.appendChild(block);

    const hist = cat.history.slice().reverse(); // oldest -> newest
    const ctx = block.querySelector('canvas').getContext('2d');
    const color = cat.role === 'speculative' ? '#5EC8D8' : (cat.role === 'commercial' || cat.role === 'institutional' ? '#E8B04B' : '#8B8FE8');
    const c = new Chart(ctx, {
      type: 'line',
      data: {
        labels: hist.map(h => h.date),
        datasets: [{ data: hist.map(h => h.net), borderColor: color, backgroundColor: 'transparent', pointRadius: 0, borderWidth: 1.75, tension: 0.15 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#7C8790', maxTicksLimit: 6, font: { family: 'IBM Plex Mono', size: 9 } }, grid: { color: '#1A2027' } },
          y: { ticks: { color: '#7C8790', callback: v => Number(v).toLocaleString(), font: { family: 'IBM Plex Mono', size: 9 } }, grid: { color: '#1A2027' } },
        }
      }
    });
    charts[side].push(c);
  });
}

function renderPane(side){ buildPane(side); }

fetch(DATA_URL)
  .then(r => r.json())
  .then(d => {
    DATA = d;
    document.getElementById('asof').textContent = d.as_of_date;
    document.getElementById('generated').textContent = d.generated_at;
    renderPane('left');
    renderPane('right');
  })
  .catch(err => {
    document.querySelector('.panes').innerHTML =
      '<div style="color:var(--muted);font-family:var(--mono);">Could not load ' + DATA_URL + ' — ' + err + '</div>';
  });
</script>
</body>
</html>
